[project]
name = "nutrisight-backend"
version = "0.1.0"
description = "NutriSight 파일럿 백엔드"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.14.0",
    "fastapi[standard]>=0.165.0",
    "pillow==13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
